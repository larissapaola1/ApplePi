#   python -m aet.backtest --train data/train_prices_15min.csv --config configs/round4.yaml --folds monthly
extends: e6.yaml
candidates:
  - {name: I2}                                                     # incumbent
  - {name: R4_scale_0.7, residual_scale: 0.7}
  - {name: R4_scale_0.9, residual_scale: 0.9}
